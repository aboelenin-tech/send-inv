<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send the invitation to friends</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4ecd8;--card:#fbf6e9;--ink:#2b1d14;--wine:#7a1f2b;--gold:#a67c37;--muted:#6d5a48;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1b130e;--card:#241a14;--ink:#f0e4cb;--wine:#d98a94;--gold:#cfa459;--muted:#b5a287}}
:root[data-theme="dark"]{--paper:#1b130e;--card:#241a14;--ink:#f0e4cb;--wine:#d98a94;--gold:#cfa459;--muted:#b5a287}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;padding:20px 14px}
body.ar{font-family:"Amiri","Times New Roman",serif}
.box{max-width:560px;margin:0 auto;background:var(--card);border:3px double var(--gold);padding:26px 20px;position:relative}
h1{margin:4px 0 2px;text-align:center;color:var(--wine);font-size:30px}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.lang{position:absolute;top:8px;inset-inline-end:8px;background:none;border:1px solid var(--gold);color:var(--gold);padding:2px 12px;cursor:pointer;font:inherit;font-size:15px}
label{display:block;margin:16px 0 6px;color:var(--wine);font-weight:600}
textarea,input{width:100%;padding:10px 12px;border:1px solid var(--gold);background:var(--paper);color:var(--ink);font:inherit;font-size:18px}
textarea{resize:vertical}
.list{margin:18px 0 0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dotted var(--gold)}
.list .n{flex:1;font-size:20px}
.b{padding:7px 14px;border:1px solid var(--wine);color:var(--wine);background:transparent;text-decoration:none;font:inherit;font-size:16px;cursor:pointer}
.b.go{background:var(--wine);color:var(--card)}
.count{color:var(--muted);margin-top:14px;text-align:center}
.hint{font-size:16px;color:var(--muted);margin:4px 0 0}
</style>
</head>
<body>
<div class="box">
  <button class="lang" id="lang">عربي</button>
  <h1 id="t1">Send the invitation</h1>
  <p class="sub" id="t2">Write the names of the people you want to invite, then send each one a personal message.</p>

  <label id="l1" for="names">1. Names of the people to invite (one per line)</label>
  <textarea id="names" rows="6"></textarea>

  <label id="l2" for="link">2. Invitation link</label>
  <input id="link" type="url" value="https://claude.ai/artifact/9tDZJWvvMXLqHJ1LsjEAcV" dir="ltr">
  <p class="hint" id="h2">Each person’s link opens the invitation with their name on it.</p>

  <label id="l3" for="msg">3. Message (you can edit it)</label>
  <textarea id="msg" rows="4"></textarea>
  <p class="hint" id="h3">{name} and {link} are filled in automatically.</p>

  <ul class="list" id="list"></ul>
  <div class="count" id="count"></div>
</div>
<script>
var T={
 en:{t1:"Send the invitation",t2:"Write the names of the people you want to invite, then send each one a personal message.",l1:"1. Names of the people to invite (one per line)",l2:"2. Invitation link",h2:"Each person’s link opens the invitation with their name on it.",l3:"3. Message (you can edit it)",h3:"{name} and {link} are filled in automatically.",send:"WhatsApp",copy:"Copy",copied:"Copied ✓",cnt:" people",ph:"Sara\nMariam\nYasmin",
  msg:"Dear {name}, we would love for you to join us at the Katb Ketab of Ibrahim & Noha on Friday, 6 November 2026. Here is your invitation: {link}",lb:"عربي"},
 ar:{t1:"إرسال الدعوة",t2:"اكتب أسماء من تريد دعوتهم، ثم أرسل لكل شخص رسالة باسمه.",l1:"١. أسماء المدعوين (اسم في كل سطر)",l2:"٢. رابط الدعوة",h2:"رابط كل شخص يفتح الدعوة وعليها اسمه.",l3:"٣. نص الرسالة (يمكنك تعديله)",h3:"{name} و {link} يتم وضعهما تلقائياً.",send:"واتساب",copy:"نسخ",copied:"تم ✓",cnt:" مدعو",ph:"سارة\nمريم\nياسمين",
  msg:"عزيزي/عزيزتي {name}، يسعدنا دعوتك لحضور كتب كتاب إبراهيم ونهى يوم الجمعة ٦ نوفمبر ٢٠٢٦. تفضل/ي بزيارة دعوتك: {link}",lb:"English"}
};
var lang="en",$=function(i){return document.getElementById(i)},msgEdited=false;
function setLang(){
 var t=T[lang];
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.body.className=lang==="ar"?"ar":"";
 ["t1","t2","l1","l2","h2","l3","h3"].forEach(function(k){$(k).textContent=t[k]});
 $("names").placeholder=t.ph;$("lang").textContent=t.lb;
 if(!msgEdited)$("msg").value=t.msg;
 build();
}
function names(){return $("names").value.split("\n").map(function(s){return s.trim()}).filter(Boolean)}
function plink(n){var h="g";new TextEncoder().encode(n).forEach(function(x){h+=("0"+x.toString(16)).slice(-2)});return $("link").value.trim().split("#")[0]+"#"+h}
function text(n){return $("msg").value.split("{name}").join(n).split("{link}").join(plink(n))}
function build(){
 var t=T[lang],ul=$("list"),ns=names();ul.innerHTML="";
 ns.forEach(function(n){
  var li=document.createElement("li"),s=document.createElement("span"),a=document.createElement("a"),c=document.createElement("button");
  s.className="n";s.textContent=n;
  a.className="b go";a.target="_blank";a.rel="noopener";a.textContent=t.send;a.href="https://wa.me/?text="+encodeURIComponent(text(n));
  c.className="b";c.type="button";c.textContent=t.copy;
  c.onclick=function(){try{navigator.clipboard.writeText(text(n));c.textContent=t.copied}catch(e){}};
  li.appendChild(s);li.appendChild(a);li.appendChild(c);ul.appendChild(li);
 });
 $("count").textContent=ns.length?ns.length+t.cnt:"";
 try{localStorage.setItem("noha-names",$("names").value)}catch(e){}
}
$("lang").onclick=function(){lang=lang==="en"?"ar":"en";msgEdited=false;setLang()};
$("names").oninput=build;$("link").oninput=build;
$("msg").oninput=function(){msgEdited=true;build()};
try{$("names").value=localStorage.getItem("noha-names")||""}catch(e){}
setLang();
</script>
</body>
</html>
